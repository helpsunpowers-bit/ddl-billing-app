<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Billing App</title>
<style>
:root{--p:#141414;--pl:#fdecc8;--bg:#f2f4f3;--c:#fff;--t:#1c2624;--m:#68766f;--b:#d9e0dd;--r:#c62828;--g:#1b8a4b}
@media(prefers-color-scheme:dark){:root{--pl:#173a33;--bg:#0f1614;--c:#18211f;--t:#e6eeea;--m:#8fa199;--b:#2a3733;--r:#ef6b6b;--g:#4cc27f}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 110px}
#app{max-width:640px;margin:0 auto;padding:12px}
h3,h4{margin:14px 0 8px}
small{color:var(--m);display:block;font-size:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
label{display:block;font-size:12px;color:var(--m);flex:1;min-width:90px}
label input,label select{margin-top:3px;color:var(--t)}
.row{display:flex;gap:8px;margin:6px 0;align-items:flex-end;flex-wrap:wrap}
.bt{background:var(--p);color:#fff;border:0;border-radius:8px;padding:11px 14px;font:600 14px inherit;flex:1;cursor:pointer}
.bt.s{background:var(--pl);color:var(--p)}
.bt.d{background:transparent;color:var(--r);border:1px solid var(--r)}
.x{background:none;border:0;color:var(--r);font-size:18px;padding:6px 10px;cursor:pointer}
.cd,.ln,.k,.bx{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin:6px 0}
.cd{display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.r{text-align:right}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k b{font-size:18px}
.hd{display:flex;gap:10px;align-items:center;background:var(--p);color:#fff;padding:14px;border-radius:12px}
.hd small{color:#cfe6df}.lg{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;background:var(--pl);color:var(--p)}
.tag.u{background:#fde4e4;color:#b71c1c}.tag.pa{background:#fff2d6;color:#8a5a00}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:11px 0;font:600 12px inherit}
nav button.on{color:var(--p);box-shadow:inset 0 3px 0 var(--p)}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-weight:700;font-size:17px;border-top:1px solid var(--b);margin-top:4px;padding-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.chips button{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:16px;padding:6px 12px;white-space:nowrap}
.chips button.on{background:var(--p);color:#fff;border-color:var(--p)}
#pvw{display:none;position:fixed;inset:0;background:#fff;color:#000;overflow:auto;z-index:99}
#pv{padding:16px;max-width:760px;margin:auto;font:15px/1.4 Arial,sans-serif}
#pv table{width:100%;border-collapse:collapse;margin:10px 0}
#pv th,#pv td{border:1px solid #999;padding:5px;text-align:left}
#pv th{background:#eee}#pv .n{text-align:right}
.pb{display:flex;gap:8px;padding:10px;position:sticky;top:0;background:#fff}
@media print{#app,nav,.noprint{display:none!important}#pvw{position:static}body{padding:0}}
.au label{margin:8px 0}
nav button{font:600 11px system-ui,sans-serif;padding:11px 0}
.rt td,.rt th{padding:5px;border-bottom:1px solid var(--b)}
#pvw .bx,#pvw .k,#pvw .cd,#pvw .ln{background:#fff;color:#000;border-color:#ddd}
#pvw input,#pvw select{background:#fff;color:#000;border-color:#bbb}
#pvw .chips button{background:#fff;color:#000}#pvw .chips button.on{background:var(--p);color:#fff}
#pv .ph{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--a);padding-bottom:8px}
#pv[data-h=banner] .ph{background:var(--a);color:#fff;padding:12px;border:0}
#pv[data-h=center] .ph{flex-direction:column;text-align:center;border-bottom:3px double var(--a)}
#pv[data-h=side] .ph{border-bottom:0;border-left:6px solid var(--a);padding-left:10px}
#pv .ttl{color:var(--a)}
#pv[data-t=stripe] td,#pv[data-t=stripe] th{border:0}#pv[data-t=stripe] th{background:var(--a);color:#fff}#pv[data-t=stripe] tr:nth-child(even) td{background:#f3f3f3}
#pv[data-t=clean] td,#pv[data-t=clean] th{border:0;border-bottom:1px solid #ccc}#pv[data-t=clean] th{background:none;color:var(--a)}
#pv[data-t=dark] th{background:#222;color:#fff}
.row>label{flex:1 1 100%;min-width:100%}
#pv{display:flex;flex-direction:column}
@media screen{#pv{min-height:calc(100vh - 40px)}}
@media print{#pv{padding:0;max-width:none}}
@page{size:A4;margin:10mm}
nav{overflow-x:auto}nav button{flex:1 0 66px}
.tm .nt{display:none!important}.tonly{display:none}.tm .tonly{display:block}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="pvw"></div>
<datalist id="il"></datalist>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const td=()=>new Date().toISOString().slice(0,10);
const DF=()=>[{k:'name',l:'Party Name',v:1},{k:'phone',l:'Mobile',v:1},{k:'addr',l:'Address',v:1},{k:'gst',l:'GSTIN',v:1}];
const DC=()=>[{k:'hsn',l:'HSN',v:0},{k:'disc',l:'Disc %',v:0},{k:'gst',l:'GST %',v:1}];
function load(){try{const x=JSON.parse(localStorage.getItem('bill_v1'));if(x)return x}catch(e){}
return{co:{},fields:DF(),cols:DC(),items:[],docs:[],seq:{invoice:1,quotation:1}}}
function save(){try{localStorage.setItem('bill_v1',JSON.stringify(S))}catch(e){alert('Unable to save data.')}}
let S=load(),V='home',D=null,Q='',F='all';S.led=S.led||[];

function calc(d){let sub=0,ds=0,tx=0;
d.lines.forEach(l=>{const b=l.q*l.r,x=b*(l.disc||0)/100;sub+=b;ds+=x;tx+=(b-x)*(l.gst||0)/100});
const total=Math.round((sub-ds+tx)*100)/100,paid=d.pays.reduce((s,p)=>s+(+p.a||0),0);
return{sub,ds,tx,total,paid,due:total-paid}}
const st=d=>{if(d.type=='quotation')return['Quotation',''];const t=calc(d);
return t.due<=0.5&&t.total>0?['Paid','']:t.paid>0?['Partial','pa']:['Unpaid','u']};

function R(){
if(!AU){authv();return}
$('#nav').style.display='flex';if(V!=LV){LV===null?history.replaceState({v:V},''):history.pushState({v:V},'');LV=V}
$('#nav').innerHTML=[['home','Home'],['bills','Invoices'],['led','Ledger'+(isP()?'':'🔒')],['items','Items'],['tpl','Templates'],['rep','Report'],['set','Settings']]
.map(([k,l])=>`<button class="${V==k||(k=='led'&&V=='lp')?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
$('#il').innerHTML=S.items.map(i=>`<option value="${esc(i.n)}">`).join('');
$('#app').innerHTML=(V=='ed'?'':cbar()+(V=='home'||V=='lp'?'':'<button class="bt s" style="flex:none;margin-bottom:8px" onclick="history.back()">← Back</button>'))+({home,bills,led:ledv,lp:lpv,items,tpl:tpv,rep:repv,set,ed:edv})[V]();
if(V=='bills')ls();if(V=='ed'){tot();sgi()}}
function go(v){V=v;R();scrollTo(0,0)}

function cards(a){return a.length?a.map(d=>{const t=calc(d),s=st(d);
return`<div class="cd" onclick="ed(${d.id})"><div><b>${esc(d.f.name||'Walk-in Customer')}</b><small>${esc(d.no)} · ${d.date}</small></div>
<div class="r"><b>${m(t.total)}</b><span class="tag ${s[1]}">${s[0]}</span></div></div>`}).join(''):'<small>No documents yet. Create a new invoice or quotation.</small>'}

function home(){const iv=S.docs.filter(d=>d.type=='invoice');let s=0,p=0;
iv.forEach(d=>{const t=calc(d);s+=t.total;p+=t.paid});
return`${prb()}<div class="g"><div class="k"><small>Total Sales</small><b>${m(s)}</b></div>
<div class="k"><small>Received</small><b style="color:var(--g)">${m(p)}</b></div>
<div class="k"><small>Pending</small><b style="color:var(--r)">${m(s-p)}</b></div>
<div class="k"><small>Quotations</small><b>${S.docs.length-iv.length}</b></div></div>
<div class="row"><button class="bt" onclick="nw('invoice')">+ New Invoice</button><button class="bt s" onclick="nw('quotation')">+ New Quotation</button></div>
<h4>Recent</h4>${cards(S.docs.slice(-5).reverse())}`}

function bills(){return`<div class="row"><button class="bt" onclick="nw('invoice')">+ New Invoice</button><button class="bt s" onclick="nw('quotation')">+ New Quotation</button></div>
<input placeholder="Search by party or number" value="${esc(Q)}" oninput="Q=this.value;ls()">
<div class="chips">${[['all','All'],['invoice','Invoices'],['quotation','Quotations'],['due','Unpaid']].map(([k,l])=>`<button class="${F==k?'on':''}" onclick="F='${k}';R()">${l}</button>`).join('')}</div><div id="ls"></div>`}
function ls(){const q=Q.toLowerCase();
const a=S.docs.filter(d=>(F=='all'||(F=='due'?d.type=='invoice'&&calc(d).due>0.5:d.type==F))&&((d.f.name||'')+d.no).toLowerCase().includes(q)).reverse();
$('#ls').innerHTML=cards(a)}

/* ---------- Editor ---------- */
function nw(t){D={id:Date.now(),type:t,no:'',date:td(),f:{},lines:[{n:'',q:1,r:0,hsn:'',disc:0,gst:0}],pays:[],tt:S.tax.cgst||S.tax.sgst?'cs':S.tax.igst?'i':'g',note:S.co.terms||''};V='ed';R();scrollTo(0,0)}
function ed(id){D=JSON.parse(JSON.stringify(S.docs.find(x=>x.id==id)));V='ed';R();scrollTo(0,0)}
function edv(){const cols=S.cols.filter(c=>c.v);
return`<div class="${D.tplId?'tm':'ed0'}"><div class="row"><button class="bt s" onclick="history.back()" style="flex:0">← Back</button>
<b style="flex:1;text-align:center">${D.tplId?'Edit Template':D.type=='invoice'?'Invoice':'Quotation'}</b>
${D.type=='quotation'?`<button class="bt s nt" style="flex:0" onclick="cv()">Convert to Invoice${isP()?'':' 🔒'}</button>`:''}</div>
<div class="row tonly"><label>Template Name<input value="${esc(D.name||'')}" oninput="D.name=this.value"></label></div>
<div class="row nt"><label>Number<input value="${esc(D.no)}" placeholder="Auto" oninput="D.no=this.value"></label>
<label>Date<input type="date" value="${D.date}" oninput="D.date=this.value"></label></div>
<div class="row nt">${D.type=='quotation'?`<label>Validity<input placeholder="e.g. 7 days" value="${esc(D.val||'')}" oninput="D.val=this.value"></label>`:`<label>Due Date<input type="date" value="${D.due||''}" oninput="D.due=this.value"></label>`}</div>
<div class="row"><label>GST Type<select onchange="D.tt=this.value;tot()">${[['cs','CGST + SGST',S.tax.cgst||S.tax.sgst],['i','IGST',S.tax.igst],['g','GST (no breakup)',1]].filter(x=>x[2]).map(x=>`<option value="${x[0]}" ${(D.tt||'cs')==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label></div>
${S.fields.filter(f=>f.v).map(f=>`<div class="row nt"><label>${esc(f.l)}<input value="${esc(D.f[f.k]||'')}" oninput="D.f['${f.k}']=this.value"></label></div>`).join('')}
<h4>Items</h4>
${D.lines.map((l,i)=>`<div class="ln"><small><b>Item ${i+1}</b></small><div class="row"><input list="il" placeholder="Item name" value="${esc(l.n)}" style="flex:1" oninput="sl(${i},'n',this.value)" onchange="pick(${i},this.value)"><button class="x" onclick="dl(${i})">✕</button></div>
<div class="row"><label>Qty<input type="number" inputmode="decimal" value="${l.q}" oninput="sl(${i},'q',this.value)"></label>
<label>Rate<input type="number" inputmode="decimal" value="${l.r}" oninput="sl(${i},'r',this.value)"></label>
${cols.map(c=>`<label>${esc(c.l)}<input ${c.k=='hsn'?'':'type="number" inputmode="decimal"'} value="${esc(l[c.k]??'')}" oninput="sl(${i},'${c.k}',this.value)"></label>`).join('')}</div>
<div class="row"><label>Item Details<textarea rows="3" oninput="sl(${i},'dt',this.value)">${esc(l.dt||'')}</textarea></label></div>
<div class="row"><label>Warranty<textarea rows="3" oninput="sl(${i},'wr',this.value)">${esc(l.wr||'')}</textarea></label></div>
<div class="row"><label>Quality<textarea rows="3" oninput="sl(${i},'ql',this.value)">${esc(l.ql||'')}</textarea></label></div>
<div class="row"><label>Performance<textarea rows="3" oninput="sl(${i},'pf',this.value)">${esc(l.pf||'')}</textarea></label></div>
<div class="row"><label>List Style<select onchange="sl(${i},'ds',this.value)"><option value="n" ${l.ds!='b'?'selected':''}>Numeric</option><option value="b" ${l.ds=='b'?'selected':''}>Bullet</option></select></label></div><small id="la${i}">Amount: ${m(lineAmt(l))}</small></div>`).join('')}
<div class="row"><button class="bt s" onclick="D.lines.push({n:'',q:1,r:0,hsn:'',disc:0,gst:0});R()">+ New Item</button><button class="bt" onclick="pk()">Select from Items</button><button class="bt s nt" onclick="tpick()">Add Template</button></div>
<div class="bx tot" id="tot"></div>
<h4 class="nt">Payments</h4>
${D.pays.map((p,i)=>`<div class="ln nt"><div class="row"><label>Amount<input type="number" inputmode="decimal" value="${p.a}" oninput="sp(${i},'a',this.value)"></label>
<label>Date<input type="date" value="${p.d}" oninput="sp(${i},'d',this.value)"></label>
<label>Mode<select onchange="sp(${i},'m',this.value)">${['Cash','UPI','Bank','Cheque'].map(x=>`<option ${x==p.m?'selected':''}>${x}</option>`).join('')}</select></label>
<button class="x" onclick="D.pays.splice(${i},1);R()">✕</button></div>
<input placeholder="Note (optional)" value="${esc(p.n||'')}" oninput="sp(${i},'n',this.value)">
<div class="row"><label>Attach Receipt<input type="file" accept="image/*" onchange="cmp(this,x=>{D.pays[${i}].img=x;R()})"></label>${p.img?`<img src="${p.img}" style="height:44px;border-radius:6px" onclick="vimg(D.pays[${i}].img)"><button class="x" onclick="D.pays[${i}].img='';R()">✕</button>`:''}<button class="bt s" style="flex:0" onclick="pw(${i})">WhatsApp</button></div></div>`).join('')}
<button class="bt s nt" style="width:100%" onclick="D.pays.push({a:'',d:td(),m:'Cash',n:''});R()">+ Add Payment</button>
<h4>Terms & Conditions</h4><textarea rows="3" oninput="D.note=this.value">${esc(D.note)}</textarea>
<button class="bt tonly" style="width:100%;margin-top:12px" onclick="tsave()">Save Template</button>
<div class="row nt" style="margin-top:12px"><button class="bt" onclick="sd()">Save</button><button class="bt s" onclick="pr()">Print / PDF</button><button class="bt s" onclick="wa()">WhatsApp</button>${D.type=='invoice'?'<button class="bt s" onclick="rm()">Payment Reminder</button>':''}</div>
${S.docs.some(x=>x.id==D.id)?'<div class="row nt"><button class="bt d" onclick="del()">Delete</button></div>':''}${D.type=='quotation'?'<button class="bt s nt" style="width:100%;margin-top:12px" onclick="tsv()">Save as Template</button>':''}</div>`}
function sl(i,k,v){D.lines[i][k]=(k=='n'||k=='hsn'||k=='dt'||k=='ds'||k=='wr'||k=='ql'||k=='pf')?v:(+v||0);tot()}
function sp(i,k,v){D.pays[i][k]=v;tot()}
function dl(i){D.lines.splice(i,1);if(!D.lines.length)D.lines.push({n:'',q:1,r:0,hsn:'',disc:0,gst:0});R()}
function pick(i,v){const it=S.items.find(x=>x.n==v);if(it){Object.assign(D.lines[i],{r:+it.r||0,hsn:it.hsn||'',gst:+it.gst||0});R()}}
function tot(){const t=calc(D),e=$('#tot');if(!e)return;D.lines.forEach((l,i)=>{const a=$('#la'+i);if(a)a.textContent='Amount: '+m(lineAmt(l))});
e.innerHTML=`<div><span>Subtotal</span><span>${m(t.sub)}</span></div>${t.ds?`<div><span>Discount</span><span>- ${m(t.ds)}</span></div>`:''}${gsp(D,t).map(([n,v])=>`<div><span>${n}</span><span>${m(v)}</span></div>`).join('')}
<div class="big"><span>Total</span><span>${m(t.total)}</span></div>
<div><span>Received</span><span style="color:var(--g)">${m(t.paid)}</span></div>
<div><b>Balance Due</b><b style="color:${t.due>0.5?'var(--r)':'var(--g)'}">${m(t.due)}</b></div>`;if(D.tplId){e.lastElementChild.remove();e.lastElementChild.remove()}}
function sd(){autoItems();if(!D.no){const k=D.type;D.no=(k=='invoice'?S.co.ip||'INV-':S.co.qp||'QT-')+String(S.seq[k]++).padStart(4,'0')}
const i=S.docs.findIndex(x=>x.id==D.id);i<0?S.docs.push(D):S.docs[i]=D;save();history.back()}
function del(){if(confirm('Delete this document?')){S.docs=S.docs.filter(x=>x.id!=D.id);save();history.back()}}

/* ---------- Print / Share ---------- */
function pvh(d){const c=S.co,t=calc(d),cols=S.cols.filter(x=>x.v);
return`<div class="ph">
${c.logo?`<img src="${c.logo}" style="width:64px;height:64px;object-fit:contain">`:''}
<div><b style="font-size:25px">${esc(c.name||'Company')}</b>${c.addr?'<br>'+esc(c.addr).replace(/\n/g,'<br>'):''}${c.phone?'<br>Ph: '+esc(c.phone):''}${c.gst?'<br>GSTIN: '+esc(c.gst):''}</div></div>
<h3 class="ttl" style="text-align:center;margin:10px 0">${d.type=='invoice'?(c.gst?'TAX INVOICE':'INVOICE'):'QUOTATION'}</h3>
<div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:4px"><div>No: <b>${esc(d.no||'-')}</b><br>Date: <b>${d.date}</b></div><div style="text-align:right">${d.type=='quotation'?(d.val?'Validity: <b>'+esc(/^\d+$/.test(String(d.val).trim())?d.val.trim()+' days':d.val)+'</b>':''):(d.due?'Due Date: <b>'+d.due+'</b>':'')}</div></div>
${S.fields.filter(f=>f.v&&d.f[f.k]).map(f=>`<div>${esc(f.l)}: <b>${esc(d.f[f.k])}</b></div>`).join('')}
<table><tr><th>#</th><th>Item</th><th class="n">Qty</th><th class="n">Rate</th>${cols.map(x=>`<th class="n">${esc(x.l)}</th>`).join('')}<th class="n">Amount</th></tr>
${d.lines.filter(l=>l.n||l.r).map((l,i)=>{const b=l.q*l.r,x=b*(l.disc||0)/100;
return`<tr><td>${i+1}</td><td>${esc(l.n)}${dth(l,'dt')}${dth(l,'wr','Warranty')}${dth(l,'ql','Quality')}${dth(l,'pf','Performance')}</td><td class="n">${l.q}</td><td class="n">${l.r}</td>${cols.map(k=>`<td class="n">${esc(l[k.k]??'')}</td>`).join('')}<td class="n">${m(b-x+(b-x)*(l.gst||0)/100)}</td></tr>`}).join('')}</table>
<div style="text-align:right">Subtotal: ${m(t.sub)}<br>${t.ds?`Discount: -${m(t.ds)}<br>`:''}${gsp(d,t).map(([n,v])=>`${n}: ${m(v)}<br>`).join('')}<b style="font-size:18px">Total: ${m(t.total)}</b>
${d.type=='invoice'?`<br>Received: ${m(t.paid)}<br><b>Balance: ${m(t.due)}</b>`:''}</div>
${d.type=='invoice'&&d.pays.length?`<div style="margin-top:8px"><b>Payments</b><br>${d.pays.map(p=>`${p.d} · ${esc(p.m)} · ${m(p.a)} ${esc(p.n||'')}`).join('<br>')}</div>`:''}
${c.bank?`<div style="margin-top:8px"><b>Bank / UPI Details</b><br>${esc(c.bank).replace(/\n/g,'<br>')}</div>`:''}
${d.note?`<div style="margin-top:8px"><b>Terms & Conditions</b><br>${esc(d.note).replace(/\n/g,'<br>')}</div>`:''}
<div style="display:flex;justify-content:space-between;margin-top:30px"><div>${d.csig?`<img src="${d.csig}" style="height:50px"><br>`:'<br><br>'}Customer Signature</div><div style="text-align:right">For ${esc(c.name||'')}<br>${c.sign?`<img src="${c.sign}" style="height:50px"><br>`:'<br><br>'}Authorised Signatory</div></div><div style="text-align:center;font-size:10px;color:#888;margin-top:auto;padding-top:24px">Powered by digidashland.in</div>`}
function pr(){const ix=isP()?(S.tpl||0):0,t=T[ix];

return`<div class="row"><button class="bt s" style="flex:0" onclick="history.back()">← Back</button><b style="flex:1;text-align:center">${esc(p.party)}</b></div>
<div class="bx"><small>${esc(p.phone||'No mobile number')}</small><b style="font-size:20px">${lt(b)}</b></div>

<div class="row"><label>Date<input type="date" value="${LE.d}" oninput="LE.d=this.value"></label><label>Note<input value="${esc(LE.n)}" oninput="LE.n=this.value"></label></div>
<div class="row"><label>Attach Receipt<input type="file" accept="image/*" onchange="cmp(this,x=>{LE.img=x;R()})"></label>${LE.img?`<img src="${LE.img}" style="height:44px;border-radius:6px"><button class="x" onclick="LE.img='';R()">✕</button>`:''}</div>
<label style="display:flex;gap:6px;align-items:center;margin:8px 0"><input type="checkbox" style="width:auto" ${LE.wa?'checked':''} onchange="LE.wa=this.checked?1:0">Send WhatsApp notification on save</label>
<button class="bt" style="width:100%" onclick="lsv()">Save Entry</button></div>
<h4>Transactions</h4>${p.ent.slice().sort((x,y)=>x.d<y.d?1:x.d>y.d?-1:y.id-x.id).map(e=>`<div class="ln"><div class="row" style="justify-content:space-between;align-items:center"><div><b>${e.t=='gave'?'You Gave':'You Got'}: ${m(e.a)}</b><small>${fd(e.d)} ${esc(e.n||'')}</small></div>
<div>${e.img?`<img src="${e.img}" style="height:40px;border-radius:6px;vertical-align:middle" onclick="vimg(le(${e.id}).img)">`:''}<button class="x" style="font-size:14px;color:var(--p)" onclick="lw(${e.id})">WhatsApp</button><button class="x" onclick="lde(${e.id})">✕</button></div></div></div>`).join('')||'<small>No entries yet.</small>'}
<div class="row"><button class="bt s" onclick="lpdf(${p.id})">Download History (PDF)</button><button class="bt s" onclick="lsend(${p.id})">Send History</button></div>
<div class="row"><button class="bt s" onclick="lrem()">Send Reminder</button><button class="bt d" onclick="ldp()">Delete Party</button></div>`}
function lmsg(p,e){const b=lb(p);return`*${S.co.name||''}*\nDear ${p.party},\n${e.t=='gave'?m(e.a)+' has been given to you':'We have received '+m(e.a)+' from you'} on ${fd(e.d)}${e.n?' ('+e.n+')':''}.\n\nCurrent balance: ${b>0.5?m(b)+' payable by you':b<-0.5?m(-b)+' payable to you':'account settled'}.\nThank you.`}

const e={id:Date.now(),d:LE.d||td(),t:LE.t,a,n:LE.n,img:LE.img};p.ent.push(e);save();const w=LE.wa;LE={t:LE.t,a:'',d:td(),n:'',img:'',wa:w};R();if(w)lw(e.id)}
function lw(id){const p=lo(),e=le(id);wtxt(p.phone,lmsg(p,e),e.img)}
function lrem(){const p=lo(),b=lb(p);wtxt(p.phone,`*${S.co.name||''}*\nDear ${p.party},\nAccount summary:\n`+p.ent.slice(-5).map(e=>`${fd(e.d)} | ${e.t=='gave'?'Given':'Received'} ${m(e.a)}`).join('\n')+`\n\n${b>0.5?'Outstanding balance: '+m(b)+'. Kindly arrange the payment at your earliest convenience.':b<-0.5?'Balance payable to you: '+m(-b)+'.':'Your account is fully settled.'}\nThank you.`)}

/* ---------- Ledger history ---------- */
const lrows=p=>{let b=0;return p.ent.slice().sort((a,c)=>a.d<c.d?-1:a.d>c.d?1:a.id-c.id).map(e=>{b+=(e.t=='gave'?1:-1)*(+e.a||0);return{e,b}})};
function lsend(id){const p=S.led.find(x=>x.id==id),r=lrows(p),b=lb(p);
if(!r.length)return alert('This party has no entries.');
wtxt(p.phone,`*${S.co.name||''}*\nLedger statement: *${p.party}*\n\n`+r.map(({e,b})=>`${fd(e.d)} | ${e.t=='gave'?'Given':'Received'} ${m(e.a)}${e.n?' ('+e.n+')':''} | Balance ${m(Math.abs(b))}${b>0.5?' (payable by you)':b<-0.5?' (payable to you)':''}`).join('\n')+`\n\n*${b>0.5?'Total outstanding: '+m(b):b<-0.5?'Total payable to you: '+m(-b):'Account settled'}*`)}
function lpdf(id){const p=S.led.find(x=>x.id==id),c=S.co,W=1240,H=1754,pg=[],F='system-ui,Arial,sans-serif';let cv,x,y;
if(!p.ent.length)return alert('This party has no entries.');
const np=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=H;x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);pg.push(cv);y=90};
const tx=(t,px,yy,f,al,col)=>{x.font=f;x.textAlign=al||'left';x.fillStyle=col||'#000';x.fillText(t,px,yy)};
const wr=(t,w,f)=>{x.font=f;const o=[];let l='';for(const ch of String(t).replace(/\s+/g,' ')){if(x.measureText(l+ch).width>w){o.push(l);l=ch.trim()}else l+=ch}if(l)o.push(l);return o.length?o:['']};
const ln=()=>{x.fillStyle='#ccc';x.fillRect(70,y,W-140,2)};
np();tx(c.name||'Company',70,y,'bold 46px '+F);y+=42;
[c.addr,c.phone?'Ph: '+c.phone:'',c.gst?'GSTIN: '+c.gst:''].filter(Boolean).forEach(s=>wr(s,W-140,'26px '+F).forEach(t=>{tx(t,70,y,'26px '+F,0,'#444');y+=34}));
y+=20;ln();y+=50;tx('Ledger Statement',70,y,'bold 38px '+F);y+=48;
tx('Party: '+p.party+(p.phone?'  ('+p.phone+')':''),70,y,'30px '+F);y+=40;
tx('Date: '+fd(td()),70,y,'26px '+F,0,'#444');y+=50;
const rw=lrows(p),b=lb(p),dg=p.ent.filter(e=>e.t=='gave').reduce((s,e)=>s+ +e.a,0),lk=p.ent.filter(e=>e.t!='gave').reduce((s,e)=>s+ +e.a,0);
tx('Total given: '+m(dg)+'      Total received: '+m(lk),70,y,'28px '+F);y+=44;
tx('Balance: '+m(Math.abs(b))+' - '+(b>0.5?p.party+' owes you':b<-0.5?'you owe '+p.party:'settled'),70,y,'bold 32px '+F,0,b>0.5?'#1b8a4b':b<-0.5?'#c62828':'#000');y+=40;
const hd=()=>{y+=30;x.fillStyle='#e8f0ee';x.fillRect(70,y-32,W-140,46);tx('Date',80,y,'bold 24px '+F);tx('Type',250,y,'bold 24px '+F);tx('Amount',600,y,'bold 24px '+F,'right');tx('Note',640,y,'bold 24px '+F);tx('Balance',W-80,y,'bold 24px '+F,'right');y+=30};
hd();
rw.forEach(({e,b})=>{const nl=wr(e.n||'',240,'24px '+F),h=Math.max(1,nl.length)*30+18;
if(y+h>H-120){np();hd()}
tx(fd(e.d),80,y+6,'24px '+F);tx(e.t=='gave'?'You Gave':'You Got',250,y+6,'24px '+F);tx(m(e.a),600,y+6,'24px '+F,'right');
nl.forEach((t,i)=>tx(t,640,y+6+i*30,'24px '+F));
tx(m(Math.abs(b))+(b>0.5?' To Receive':b<-0.5?' To Pay':''),W-80,y+6,'24px '+F,'right',b>0.5?'#1b8a4b':b<-0.5?'#c62828':'#000');
y+=h;ln();y+=24});
pg.forEach((k,i)=>{const q=k.getContext('2d');q.textAlign='right';q.fillStyle='#888';q.font='20px '+F;q.fillText('Page '+(i+1)+'/'+pg.length,W-70,H-40)});
const a=document.createElement('a');a.href=URL.createObjectURL(mkpdf(pg));a.download='ledger-'+p.party.replace(/[^\w]+/g,'_')+'-'+td()+'.pdf';document.body.appendChild(a);a.click();a.remove()}
function mkpdf(pgs){const E=new TextEncoder(),parts=[],off=[];let len=0;
const add=d=>{const u=typeof d=='string'?E.encode(d):d;parts.push(u);len+=u.length};
const obj=(n,d)=>{off[n]=len;add(n+' 0 obj\n'+d+'\nendobj\n')};
add('%PDF-1.4\n');const n=pgs.length;
obj(1,'<</Type/Catalog/Pages 2 0 R>>');
obj(2,'<</Type/Pages/Count '+n+'/Kids['+pgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>');
pgs.forEach((c,i)=>{const ju=Uint8Array.from(atob(c.toDataURL('image/jpeg',.85).split(',')[1]),ch=>ch.charCodeAt(0)),b=3+3*i,cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
obj(b,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 '+(b+2)+' 0 R>>>>/Contents '+(b+1)+' 0 R>>');
obj(b+1,'<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream');
off[b+2]=len;add((b+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+c.width+'/Height '+c.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+ju.length+'>>\nstream\n');add(ju);add('\nendstream\nendobj\n')});
const N=3+3*n,xr=len;let t='xref\n0 '+N+'\n0000000000 65535 f \n';for(let i=1;i<N;i++)t+=String(off[i]).padStart(10,'0')+' 00000 n \n';
add(t+'trailer\n<</Size '+N+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}

/* ---------- Templates, history ---------- */

${t.lines.map((l,i)=>`<small>${i+1}. ${esc(l.n)} × ${l.q} @ ${m(l.r)}</small>${dth(l,'dt')}${dth(l,'wr','Warranty')}${dth(l,'ql','Quality')}${dth(l,'pf','Performance')}`).join('')}
<div class="row"><button class="bt s" onclick="tedit(${t.id})">Edit Template</button><button class="bt d" onclick="tdel(${t.id})">Delete Template</button></div></div>`).join('')||'<small style="margin-top:10px">No templates yet. Open a quotation and tap Save as Template.</small>'}`}

function tadd(id){const c=JSON.parse(JSON.stringify(S.tpls.find(x=>x.id==id).lines)),l=D.lines;D.lines=(l.length==1&&!l[0].n&&!l[0].r)?c:l.concat(c);pkx()}

function dth(l,k,t){const a=String(l[k]||'').split('\n').map(s=>s.trim()).filter(Boolean),b=l.ds=='b';return a.length?`<div style="font-size:12.5px;color:#444;margin-top:2px">${t?`<b>${t}</b>`:''}${a.map((x,i)=>`<div>${b?'• ':(i+1)+'. '}${esc(x)}</div>`).join('')}</div>`:''}
function tedit(id){const t=S.tpls.find(x=>x.id==id);D={id:Date.now(),type:'quotation',tplId:id,name:t.name,no:'',date:td(),f:{},lines:JSON.parse(JSON.stringify(t.lines)),pays:[],tt:t.tt,note:t.note||''};V='ed';R();scrollTo(0,0)}
function tsave(){const ls=D.lines.filter(l=>l.n||l.r);if(!ls.length)return alert('Keep at least one item.');if(!(D.name||'').trim())return alert('Enter the template name.');
autoItems();Object.assign(S.tpls.find(x=>x.id==D.tplId),{name:D.name.trim(),lines:ls,tt:D.tt,note:D.note});save();history.back()}

function pfit(on){const v=$('#pv');if(!v)return;
if(!on){v.style.zoom=v.style.width=v.style.minHeight='';return}
v.style.zoom='';v.style.minHeight='';v.style.width='718px';const h=v.scrollHeight,M=1000,z=h>M?M/h:1;
v.style.zoom=z;v.style.width=(718/z)+'px';v.style.minHeight=(M/z)+'px'}
window.onbeforeprint=()=>pfit(1);window.onafterprint=()=>pfit(0);

ini();
R();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
